services:
  ubersdr_dsc:
    container_name: dsc
    image: madpsy/ubersdr_dsc:latest
    restart: unless-stopped
    cpu_shares: 512
    environment:
      # UberSDR base URL
      UBERSDR_URL: "http://ubersdr:8080"
      # DSC frequencies in Hz (comma-separated).
      # If not set, all 26 ITU DSC frequencies are monitored by default.
      # Uncomment to restrict to specific frequencies:
      # DSC_FREQS: "2187500,8414500"
      # Uncomment and set as needed:
      # WEB_PORT: "6093"
      # DSC_MIN_MARGIN: "26"  # Reduced-depth I/Q: how far below the band's own
                              # noise floor UberSDR holds the quantisation
                              # floor, in dB.  26 is the transparent default;
                              # 0 asks for lossless at roughly twice the
                              # bandwidth, anything else must be 15-60.
      # UI_PASSWORD: ""   # Set a password to enable write actions in the web UI.
                          # Leave empty (default) to disable all write actions.
    networks:
      - sdr-network
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "127.0.0.1:24224"
        fluentd-async: "true"
        tag: "dsc"

networks:
  sdr-network:
    external: true
    name: ubersdr_sdr-network
